<rect x="64" y="512" width="552" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="529" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">对外接口：MII×4 / LVDS · QSPI / SDRAM · GPIO / UART / SPI / I2C · JTAG · uC Slave</text>
