<svg viewBox="0 0 680 580" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SOC 完整系统架构图</title>
<desc>RISC-V E906 双核 SOC 结构：CPU 区、AHB 高速主干、APB 低速外设、对外接口</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="600" height="520" rx="24" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">SOC</text>
<rect x="64" y="64" width="552" height="140" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="84" y="80" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">RISC-V E906 双核</text>
